[project]
name = "daggerheart-combat-simulator"
version = "0.1.0"
description = "Monte Carlo combat simulator for Daggerheart, used to balance adversary stat blocks against party compositions"
readme = "README.md"
authors = [
    { name = "bdbrwr", email = "bart@bdbrwr.nl" }
]
requires-python = ">=3.14"
dependencies = []

requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
   testpaths = ["tests"]
   pythonpath = ["."]
