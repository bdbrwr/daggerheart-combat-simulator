[project]
name = "daggerheart-combat-simulator"
version = "0.1.0"
description = "Monte Carlo combat simulator for Daggerheart, used to balance adversary stat blocks against party compositions"
readme = "README.md"
authors = [
    { name = "bdbrwr", email = "bart@bdbrwr.nl" }
]
requires-python = ">=3.14"
dependencies = []

# No [build-system]: this project is run in place, never installed. uv treats a
# project without one as virtual - it builds the environment but doesn't try to
# package the source tree. That suits a flat layout with several top-level
# packages (dice, characters, items, adversaries, combat, encounters), which a
# single-module build backend wouldn't map onto cleanly anyway. pytest finds
# them via pythonpath below. simulation/ joins them as the Monte Carlo layer.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
   testpaths = ["tests"]
   pythonpath = ["."]
